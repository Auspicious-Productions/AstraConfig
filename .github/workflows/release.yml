# Builds AstraConfig for every Minecraft version and publishes a GitHub Release when a version tag
# (e.g. v0.1.0) is pushed. The tag must match `version` in gradle/mod.versions.toml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the mod version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' gradle/mod.versions.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in gradle/mod.versions.toml"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all Minecraft versions
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Collect the jars
        run: |
          mkdir release
          cp versions/*/build/libs/astraconfig-*.jar release/
          rm -f release/*-sources.jar
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          name: AstraConfig ${{ github.ref_name }}
          files: release/*.jar
          generate_release_notes: true
          # Tags like v0.2.0-beta.1 become pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
